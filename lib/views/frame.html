<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHS prototype kit</title>
    <style>
      body {
        background-color: #f9fbfb;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-frame__outer {
        position: relative;
        padding: 32px;
      }

      .app-frame__handle {
        position: absolute;
        z-index: 1;
      }

      .app-frame__handle::after {
        content: '';
        position: absolute;
        background: #425563;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .app-frame__handle--left,
      .app-frame__handle--right {
        top: 79px;
        bottom: 79px;
        width: 44px;
        cursor: ew-resize;
      }

      .app-frame__handle--left::after,
      .app-frame__handle--right::after {
        top: 50%;
        transform: translateY(-50%);
        width: 6px;
        height: 80px;
      }

      .app-frame__handle--left {
        left: 0;
      }

      .app-frame__handle--left::after {
        right: 20px;
      }

      .app-frame__handle--right {
        right: 0;
      }

      .app-frame__handle--right::after {
        left: 20px;
      }

      .app-frame__handle--top,
      .app-frame__handle--bottom {
        left: 79px;
        right: 79px;
        height: 44px;
        cursor: ns-resize;
      }

      .app-frame__handle--top::after,
      .app-frame__handle--bottom::after {
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 6px;
      }

      .app-frame__handle--top {
        top: 0;
      }

      .app-frame__handle--top::after {
        bottom: 20px;
      }

      .app-frame__handle--bottom {
        bottom: 0;
      }

      .app-frame__handle--bottom::after {
        top: 20px;
      }

      .app-frame__handles--horizontal,
      .app-frame__handles--vertical {
        display: contents;
      }

      .app-frame__handles--horizontal:has(:hover, .app-frame__handle--dragging) .app-frame__handle::after,
      .app-frame__handles--vertical:has(:hover, .app-frame__handle--dragging) .app-frame__handle::after,
      .app-frame__outer:has(.app-frame__handle--corner:hover, .app-frame__handle--corner.app-frame__handle--dragging) .app-frame__handle::after {
        opacity: 1;
      }

      .app-frame__handle--corner {
        width: 80px;
        height: 80px;
        z-index: 2;
      }

      .app-frame__handle--corner::after {
        display: none;
      }

      .app-frame__handle--top-left {
        top: 0;
        left: 0;
        cursor: nwse-resize;
        clip-path: polygon(0 0, 80px 0, 80px 44px, 44px 44px, 44px 80px, 0 80px);
      }

      .app-frame__handle--top-right {
        top: 0;
        right: 0;
        cursor: nesw-resize;
        clip-path: polygon(0 0, 80px 0, 80px 80px, 36px 80px, 36px 44px, 0 44px);
      }

      .app-frame__handle--bottom-left {
        bottom: 0;
        left: 0;
        cursor: nesw-resize;
        clip-path: polygon(0 0, 44px 0, 44px 36px, 80px 36px, 80px 80px, 0 80px);
      }

      .app-frame__handle--bottom-right {
        bottom: 0;
        right: 0;
        cursor: nwse-resize;
        clip-path: polygon(36px 0, 80px 0, 80px 80px, 0 80px, 0 36px, 36px 36px);
      }

      .app-frame__container {
        position: relative;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 852px;
        width: 393px;
        border: 12px solid black;
        border-radius: 47px;
        overflow: hidden;
        transform: translateZ(0);
        outline: 6px solid #f9fbfb;
        transition: border-radius 0.3s;
      }

      .app-frame__container--tablet {
        border-radius: 20px;
      }

      .app-frame__iframe {
        height: 100%;
        width: 100%;
        border: none;
        border-radius: 35px;
        position: absolute;
        top: 0;
        left: 0;
        scrollbar-width: none;
        -ms-overflow-style: none;
        transition: border-radius 0.3s;
      }

      .app-frame__container--tablet .app-frame__iframe {
        border-radius: 8px;
      }

      .app-frame__iframe::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app-frame__outer">
      <div class="app-frame__container">
        <iframe
          class="app-frame__iframe"
          title="Prototype"
          src="{{ iframeSrc }}">
        </iframe>
      </div>
      <div class="app-frame__handles--horizontal">
        <div class="app-frame__handle app-frame__handle--left" aria-hidden="true"></div>
        <div class="app-frame__handle app-frame__handle--right" aria-hidden="true"></div>
      </div>
      <div class="app-frame__handles--vertical">
        <div class="app-frame__handle app-frame__handle--top" aria-hidden="true"></div>
        <div class="app-frame__handle app-frame__handle--bottom" aria-hidden="true"></div>
      </div>
      <div class="app-frame__handle app-frame__handle--corner app-frame__handle--top-left" aria-hidden="true"></div>
      <div class="app-frame__handle app-frame__handle--corner app-frame__handle--top-right" aria-hidden="true"></div>
      <div class="app-frame__handle app-frame__handle--corner app-frame__handle--bottom-left" aria-hidden="true"></div>
      <div class="app-frame__handle app-frame__handle--corner app-frame__handle--bottom-right" aria-hidden="true"></div>
    </div>
    <script>
      const DEFAULT_WIDTH = 393
      const DEFAULT_HEIGHT = 852
      const MIN_WIDTH = 320
      const MIN_HEIGHT = 568
      // Keeps resize handles clear of the viewport edge
      const VIEWPORT_MARGIN = 32
      const container = document.querySelector('.app-frame__container')
      const handles = document.querySelectorAll('.app-frame__handle')
      const iframe = document.querySelector('.app-frame__iframe')
      // null means "use the default size"
      let frameWidth = null
      let frameHeight = null

      function setTabletMode(isTablet) {
        container.classList.toggle('app-frame__container--tablet', isTablet)
      }

      function renderSize() {
        if (frameWidth === null && frameHeight === null) {
          container.style.removeProperty('width')
          container.style.removeProperty('height')
          return
        }
        container.style.width = (frameWidth !== null ? frameWidth : DEFAULT_WIDTH) + 'px'
        container.style.height = (frameHeight !== null ? frameHeight : DEFAULT_HEIGHT) + 'px'
      }

      function setFrameSize(width, height) {
        frameWidth = Math.min(width, window.innerWidth - VIEWPORT_MARGIN * 2)
        frameHeight = Math.min(height, window.innerHeight - VIEWPORT_MARGIN * 2)
        renderSize()
        setTabletMode(frameWidth >= 744)
      }

      function persistToUrl(urlParam) {
        const frameUrl = new URL(window.location.href)
        const currentUrl = urlParam !== undefined ? urlParam : frameUrl.searchParams.get('url')
        frameUrl.searchParams.delete('width')
        frameUrl.searchParams.delete('height')
        frameUrl.searchParams.delete('url')
        if (frameWidth !== null) frameUrl.searchParams.set('width', frameWidth)
        if (frameHeight !== null) frameUrl.searchParams.set('height', frameHeight)
        if (currentUrl !== null) frameUrl.searchParams.set('url', currentUrl)
        history.replaceState(null, '', frameUrl)
      }

      const initParams = new URLSearchParams(window.location.search)
      const initWidth = initParams.get('width')
      const initHeight = initParams.get('height')
      if (initWidth) frameWidth = Math.min(parseInt(initWidth), window.innerWidth - VIEWPORT_MARGIN * 2)
      if (initHeight) frameHeight = Math.min(parseInt(initHeight), window.innerHeight - VIEWPORT_MARGIN * 2)
      if (frameWidth !== null) setTabletMode(frameWidth >= 744)
      renderSize()

      handles.forEach((handle) => {
        const isCorner = handle.classList.contains('app-frame__handle--corner')
        const isLeft = handle.classList.contains('app-frame__handle--left') || handle.classList.contains('app-frame__handle--top-left') || handle.classList.contains('app-frame__handle--bottom-left')
        const isTop = handle.classList.contains('app-frame__handle--top') || handle.classList.contains('app-frame__handle--top-left') || handle.classList.contains('app-frame__handle--top-right')
        const isVertical = handle.classList.contains('app-frame__handle--top') || handle.classList.contains('app-frame__handle--bottom')
        let startX, startY, startWidth, startHeight

        handle.addEventListener('pointerdown', (e) => {
          e.preventDefault()
          handle.setPointerCapture(e.pointerId)
          startX = e.clientX
          startY = e.clientY
          startWidth = container.offsetWidth
          startHeight = container.offsetHeight
          handle.classList.add('app-frame__handle--dragging')
          if (isCorner) {
            document.body.style.cursor = (handle.classList.contains('app-frame__handle--top-left') || handle.classList.contains('app-frame__handle--bottom-right')) ? 'nwse-resize' : 'nesw-resize'
          } else {
            document.body.style.cursor = isVertical ? 'ns-resize' : 'ew-resize'
          }
          document.body.style.userSelect = 'none'
        })

        handle.addEventListener('pointermove', (e) => {
          if (!handle.hasPointerCapture(e.pointerId)) return
          const deltaX = e.clientX - startX
          const deltaY = e.clientY - startY

          if (isCorner) {
            const newWidth = isLeft ? startWidth - 2 * deltaX : startWidth + 2 * deltaX
            const newHeight = isTop ? startHeight - 2 * deltaY : startHeight + 2 * deltaY
            setFrameSize(Math.max(MIN_WIDTH, newWidth), Math.max(MIN_HEIGHT, newHeight))
          } else if (isVertical) {
            const newHeight = isTop ? startHeight - 2 * deltaY : startHeight + 2 * deltaY
            setFrameSize(startWidth, Math.max(MIN_HEIGHT, newHeight))
          } else {
            const newWidth = isLeft ? startWidth - 2 * deltaX : startWidth + 2 * deltaX
            setFrameSize(Math.max(MIN_WIDTH, newWidth), startHeight)
          }
        })

        handle.addEventListener('pointerup', (e) => {
          handle.releasePointerCapture(e.pointerId)
          handle.classList.remove('app-frame__handle--dragging')
          document.body.style.cursor = ''
          document.body.style.userSelect = ''
          persistToUrl()
        })
      })

      iframe.addEventListener('load', () => {
        try {
          document.title = iframe.contentDocument.title || 'NHS prototype kit'

          // Keep ?url= in sync so reloads return to the current page
          const { pathname, search } = iframe.contentDocument.location
          persistToUrl(pathname + search)
        } catch (_) {
          // Cross-origin – cannot read iframe document
        }
      })
    </script>
  </body>
</html>
